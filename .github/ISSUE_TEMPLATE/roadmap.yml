name: Item de roadmap
description: Agrega o actualiza un item de la página /roadmap
title: "[roadmap] <Nombre>"
labels: ["roadmap"]
body:
  - type: markdown
    attributes:
      value: |
        Este issue alimenta la página **/roadmap**.

        - El primer párrafo del resumen se muestra como texto plano.
        - Cada checkbox de "Tareas" se lista con su estado.
        - Estado: agrega una etiqueta `roadmap:working`, `roadmap:planned` o `roadmap:idea` (sin etiqueta = "más adelante"). Cierra el issue cuando esté hecho.
        - Item activo ("ahora"): etiqueta `roadmap:now` o autoasígnate.
        - Milestone: usalo como campo nativo de GitHub (Milestones del repo), no lo metas en el título. Es una fase o epic real (ej. "Rendimiento del blog"), NO una versión.
        - Todo lo que escribas después de una línea `===` queda solo en el issue: nunca se manda a la página de roadmap.
  - type: textarea
    id: summary
    attributes:
      label: Resumen
      description: Una o dos frases. Qué es y por qué.
      placeholder: Vista interna para ver qué posts concentran más tráfico.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tareas
      description: Una por línea, con checkbox. Marca `[x]` las hechas.
      value: |
        - [ ] Primera tarea
        - [ ] Segunda tarea
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Detalle interno (opcional)
      description: Notas o contexto interno. No se muestra en /roadmap.
      value: |
        ===
    validations:
      required: false
